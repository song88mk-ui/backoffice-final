---
name: Backoffice.API-Perf-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - performance-update
  paths:
    include:
      - Backoffice.API
    exclude:
      - .ci
      - .github
      - '**/README.md'

variables:
  SLACK_URL: "https://hooks.slack.com/services/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"  # ci-cd
  DOCKER_BUILDKIT: 1
  ContainerRegistryConnection: 'd9ff7663-ca22-49ae-be23-83dd308dcef4'
  ImageRepository: bo-api-perf
  ContainerRegistry: song88.azurecr.io
  AzureConnection: azurerm-song88-prod-service

stages:
  - stage: build
    displayName: Docker Build
    jobs:
      - job: docker_build
        displayName: Build App via Docker
        steps:
          - checkout: self
            clean: true
            persistCredentials: true
            fetchDepth: 2

          - task: Bash@3
            displayName: Set Build Name
            inputs:
              targetType: inline
              script: |
                PKG_VERSION=v$(jq -r '.version' .version)
                BUILD_NUMBER="Backoffice.API-Perf-${PKG_VERSION}.${BUILD_BUILDID}"
                echo "##vso[task.setvariable variable=VERSION]${PKG_VERSION}"
                echo "##vso[build.updatebuildnumber]${BUILD_NUMBER}"

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(ContainerRegistryConnection)

          - task: Docker@2
            displayName: Docker Build
            inputs:
              command: buildAndPush
              buildContext: $(Build.SourcesDirectory)
              repository: $(ImageRepository)
              containerRegistry: $(ContainerRegistry)
              Dockerfile: Backoffice.API/Dockerfile
              tags: $(Build.BuildId)

  - stage: stage_staging_release
    dependsOn: build
    displayName: Staging - Deploy ACA
    jobs:
      - deployment: Deployment
        displayName: Deploy to ACA
        pool:
          vmImage: "ubuntu-latest"
        environment:
          name: PREPROD_HK_WEB
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - task: AzureCLI@2
                  env:
                    TAG: $(Build.BuildId)
                  inputs:
                    azureSubscription: $(AzureConnection)
                    visibleAzLogin: false
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az config set core.only_show_errors=True
                      az containerapp show \
                        -n ca-staging-bo-api-perf \
                        -g rg-production-song88 -o none
                      ret=$(az containerapp update \
                        -n ca-staging-bo-api-perf \
                        -g rg-production-song88 \
                        --output json \
                        -i song88.azurecr.io/bo-api-perf:${TAG} \
                        --container-name api | jq -r '.properties.provisioningState')
                      [[ $ret == "Succeeded" ]] && echo "Status: Success" && exit 0
                      echo "Status: ${ret}"
                      exit 1
            on:
              failure:
                steps:
                  - task: Bash@3
                    displayName: Notify CI/CD
                    inputs:
                      targetType: inline
                      script: |
                        curl -sd "{\"text\": \"Deployment Backoffice.API-Perf, Build: ${BUILD_BUILDID} to STAGING failed.\"}" ${SLACK_URL}
              success:
                steps:
                  - task: Bash@3
                    displayName: Notify CI/CD
                    inputs:
                      targetType: inline
                      script: |
                        curl -sd "{\"text\": \"Deployment Backoffice.API-Perf, Build: ${BUILD_BUILDID} to STAGING succeeded.\"}" ${SLACK_URL}
