name: BackOffice-API-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - BackOffice.API
      - Backoffice.Shared
    exclude:
      - README.md


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v0.4.0
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice.yml@bt
  parameters:
    projects:
      - BackOffice.API
    preBuild:
      - task: Bash@3
        displayName: Set Build Name
        inputs:
          workingDirectory: '$(code)\BackOffice.API'
          targetType: inline
          script: |
            APP_VERSION=$(jq -r '.version' .version)
            echo "##vso[build.updatebuildnumber]BackOffice-API-v${APP_VERSION}.${BUILD_BUILDID}"
