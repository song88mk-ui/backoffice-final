name: BackOffice-Utility-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Backoffice.Utility
      - Backoffice.Shared
    exclude:
      - README.md

resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.9.0

extends:
  template: dotnetservice.yml@bt
  parameters:
    authToFeeds: false
    runtime: win-x64
    projects:
      - Backoffice.Utility
