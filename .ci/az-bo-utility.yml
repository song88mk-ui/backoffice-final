name: $(System.TeamProject)-BackOffice-Utility-$(Build.BuildId).$(Rev:r)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Backoffice.Utility
      - BackOffice.Shared
    exclude:
      - README.md

resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v0.1.4
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice.yml@bt
  parameters:
    runtime: win-x64
    projects:
      - Backoffice.Utility
