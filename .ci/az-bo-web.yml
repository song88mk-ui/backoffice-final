name: BackOffice-Web-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Backoffice.Web
      - Backoffice.Shared
    exclude:
      - README.md


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v0.4.0
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice.yml@bt
  parameters:
    projects:
      - Backoffice.Web
    preBuild:
      - task: Bash@3
        displayName: Set Build Name
        inputs:
          workingDirectory: '$(code)\Backoffice.Web'
          targetType: inline
          script: |
            APP_VERSION=$(jq -r '.version' .version)
            echo "##vso[build.updatebuildnumber]BackOffice-Web-v${APP_VERSION}.${BUILD_BUILDID}"
