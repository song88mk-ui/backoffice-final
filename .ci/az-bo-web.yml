name: BackOffice-Web-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Backoffice.Web
      - Backoffice.Shared
    exclude:
      - README.md


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.8.0

extends:
  template: dotnetservice.yml@bt
  parameters:
    projects:
      - Backoffice.Web
