name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types:
      - released

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app.path }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - path: Backoffice.WebSocket.Service
            image: backoffice-websocket-service
          - path: Backoffice.WebSocket.API
            image: backoffice-websocket-api
          - path: Backoffice.Utility
            image: backoffice-utility-service
          - path: Backoffice.Config.Service
            image: backoffice-config-service
          - path: Backoffice.API
            image: backoffice-bo-api
          - path: Backoffice.Web
            image: backoffice-bo-web
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-stg" ]]; then
            echo "environment=stg" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
            echo "aws_region=ap-south-1" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-prd" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
            echo "aws_account_id=525375333516" >> $GITHUB_OUTPUT
            echo "aws_region=ap-east-1" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
            echo "aws_region=ap-south-1" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: |
            ${{ steps.env.outputs.aws_account_id }}.dkr.ecr.${{ steps.env.outputs.aws_region }}.amazonaws.com/${{ matrix.app.image }}
          tags: |
            type=sha,event=branch,suffix=-dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          aws-region: ${{ steps.env.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.aws_account_id }}:role/github-oidc-ecr-push-role
          role-duration-seconds: 3600
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ${{ matrix.app.path }}/Dockerfile
          push: false
          tags: image:latest
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Build & Push
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Logout to Amazon ECR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: docker logout ${{ steps.login-ecr.outputs.registry }}

  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Add NuGet source
        run: |
          dotnet nuget add source \
            --username FlyingCockatoo \
            --password ${{ secrets.NUGET_PASSWORD }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/FlyingCockatoo/index.json"

      - name: Test
        run: dotnet test backoffice-final.sln -c Release

      - name: Format
        run: dotnet format backoffice-final.sln --verify-no-changes --report
